name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. **Security issues must not be reported here**: see SECURITY.md.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Orchestrator (server)
        - Bee (node client)
        - Web panel
        - Bee panel
        - Modules
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Ubuntu 24.04, Node 24.22.1, Python 3.12, commit d24e000"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text
